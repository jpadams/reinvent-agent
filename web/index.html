<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>re:Invent Planner</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #0b1020; --panel: #121a30; --panel2: #18223d; --line: #26324f; --text: #e8ecf6; --muted: #8e9ab8;
  --accent: #35d0ba; --handson: #ffb547; --talk: #a98bff; --other: #6f7d9c; --blocked: #ff6b81; --ok: #4ade80;
  --road: #2c3a5c; --pin: #dfe6f5;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; }
a { color: var(--accent); }
header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
header .sub { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
header button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; }
.logos { display: flex; align-items: center; gap: 14px; margin-right: 6px; }
.logos .relate { height: 32px; width: auto; }
.logos .strands { height: 14px; width: auto; color: var(--text); }
.logos .x { color: var(--muted); font-size: 14px; }
main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(360px, 1.15fr) minmax(360px, 1.25fr);
  gap: 14px; padding: 14px; height: calc(100% - 52px); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0; padding: 12px 14px 8px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.panel h2 .tag { text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 500; }
/* Chat */
#chat { flex: 1.3; overflow-y: auto; padding: 0 14px 10px; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 9px 12px; border-radius: 12px; max-width: 95%; white-space: pre-wrap; }
.msg.user { background: var(--panel2); align-self: flex-end; border: 1px solid var(--line); }
.msg.agent { background: rgba(53,208,186,.09); border: 1px solid rgba(53,208,186,.28); }
.msg.agent strong { color: #fff; }
.thinking { color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .25 } to { opacity: 1 } }
#chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px 0; }
.chip { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; text-align: left; }
.chip:hover:not(:disabled) { border-color: var(--accent); }
.chip:disabled { opacity: .4; cursor: default; }
form { display: flex; gap: 8px; padding: 10px 14px 12px; }
form textarea { flex: 1; resize: none; height: 58px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
form button { background: var(--accent); color: #062421; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 650; }
form button:disabled { opacity: .5; }
/* Tool log */
#log { flex: 1; overflow-y: auto; padding: 0 14px 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; border-top: 1px solid var(--line); }
#log .tool { margin-top: 8px; color: var(--text); }
#log .tool b { color: var(--accent); }
#log .cy { color: var(--muted); margin-left: 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#log .cy.open { white-space: pre-wrap; color: #c8d2ea; }
#log .rej { color: var(--blocked); margin-left: 14px; }
#log .ok { color: var(--ok); margin-left: 14px; }
/* Agenda */
#agendaHead { padding: 0 14px 6px; color: var(--muted); font-size: 13px; min-height: 22px; }
#agendaHead b { color: var(--text); }
#timeline { position: relative; flex: 1; margin: 10px 14px 22px 58px; min-height: 0; }
.hour { position: absolute; left: -50px; right: 0; border-top: 1px dashed var(--line); font-size: 11px; color: var(--muted); }
.hour span { position: absolute; top: -8px; left: 0; width: 42px; }
.card, .block, .ghost { position: absolute; left: 0; right: 0; border-radius: 10px; padding: 6px 10px; overflow: hidden; }
.card { background: var(--panel2); border: 1px solid var(--line); border-left: 5px solid var(--talk); cursor: pointer; transition: box-shadow .3s; }
.card.hands-on { border-left-color: var(--handson); }
.card.sel { box-shadow: 0 0 0 2px var(--accent); }
.card .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.card .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
.card .w { font-size: 12px; margin-top: 4px; color: #cfd7ea; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .6px; border-radius: 4px; padding: 1px 5px; margin-right: 6px; vertical-align: 1px; }
.badge.hands-on { background: var(--handson); color: #2b1a00; }
.badge.talk { background: var(--talk); color: #1a0f3d; }
.badge.other { background: var(--pin); color: #0b1020; }
.badge.new { background: var(--ok); color: #052e14; }
.badge.kept { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.badge.booth { background: var(--accent); color: #062421; }
.card.new { animation: glow 2.4s ease-out 1; }
@keyframes glow { 0% { box-shadow: 0 0 0 4px var(--ok); } 100% { box-shadow: 0 0 0 0 transparent; } }
.block { background: repeating-linear-gradient(135deg, rgba(255,107,129,.16) 0 8px, rgba(255,107,129,.05) 8px 16px); border: 1px solid rgba(255,107,129,.5); color: var(--blocked); font-weight: 600; font-size: 13px; left: 0; }
.ghost { border: 1px dashed var(--muted); color: var(--muted); font-size: 12px; text-decoration: line-through; left: auto; width: 23%; right: 0; }
#timeline.ghosts .card, #timeline.ghosts .block { right: 25%; }
.leg { position: absolute; left: 18px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.leg i { display: inline-block; width: 2px; background: var(--muted); }
.leg.tight { color: var(--handson); }
#empty { color: var(--muted); padding: 30px 14px; text-align: center; }
#passed { padding: 0 14px 12px; }
#passed .p { border: 1px dashed var(--line); border-radius: 10px; padding: 6px 10px; margin-top: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
#passed .p b { color: #c3cbe0; font-weight: 600; }
#passed .p .r { color: var(--handson); }
/* Map + why */
#mapTabs { display: flex; gap: 6px; padding: 0 14px 6px; flex-wrap: wrap; }
#mapTabs button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; }
#mapTabs button.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
#map { flex: 1.25; min-height: 0; padding: 0 8px; }
#map svg { width: 100%; height: 100%; display: block; }
#why { flex: 1; min-height: 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
#whyBody { flex: 1; min-height: 0; padding: 0 14px 10px; overflow-y: auto; }
#whyBody .hint { color: var(--muted); font-size: 13px; padding-top: 6px; }
#whyBody .ttl { font-weight: 650; }
#whyBody .sent { font-size: 13px; color: #cfd7ea; margin: 4px 0 2px; }
#whyGraph svg { width: 100%; height: 232px; display: block; }
.note { font-size: 11px; color: var(--muted); padding: 0 14px 8px; }
svg text { font-family: system-ui, -apple-system, sans-serif; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; height: auto; } .panel { min-height: 520px; } }
</style>

    </div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const ampm = (t) => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h >= 12 ? "pm" : "am"}`; };

const DEMO_GOAL = "I'm building a production GenAI agent. I know RAG, but I want to learn tool permissions and evaluation. I only have Tuesday afternoon. Give me one hands-on session and one architecture talk.";
let S = { version: -1 }, events = [], eventCount = 0, venues = null, selected = null, mapView = "Strip", lastAgendaKey = "";

// ---------- server ----------
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return r.json();
}
async function poll() {
  try {
    const s = await api(`/api/state?events=${eventCount}`);
    if (s.events.length) { events.push(...s.events); eventCount = s.eventCount; renderLog(); }
    if (s.eventCount < eventCount) { events = []; eventCount = 0; }  // Reset happened.
    if (s.version !== S.version) { S = s; render(); }
  } catch (e) { /* server restarting */ }
  setTimeout(poll, S.busy ? 400 : 1500);
}
async function send(text) {
  if (!text.trim() || S.busy) return;
  $("input").value = "";
  S.busy = true; S.messages = [...(S.messages || []), { role: "user", text }]; renderChat();
  await api("/api/chat", { text });
}
$("form").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } };
$("reset").onclick = async () => { await api("/api/reset", {}); events = []; eventCount = 0; selected = null; mapView = "Strip"; S.version = -1; $("log").innerHTML = ""; };

// ---------- chat ----------
function renderChat() {
  const c = $("chat");
  c.innerHTML = (S.messages || []).map((m) => `<div class="msg ${m.role}">${m.role === "agent" ? md(m.text) : esc(m.text)}</div>`).join("")
    + (S.busy ? `<div class="thinking"><span class="dot"></span>${esc(currentStep())}</div>` : "");
  c.scrollTop = c.scrollHeight;
  $("send").disabled = !!S.busy;
  renderChips();
}
function currentStep() {
  const last = [...events].reverse().find((e) => e.kind === "tool");
  const names = { find_sessions: "Searching the graph", related_sessions: "Following shared topics", other_times: "Checking other runs", plan_agenda: "Scheduling and checking travel" };
  return last ? (names[last.name] || last.name) + "…" : "Thinking…";
}
function renderChips() {
  const a = S.agenda, hands = a && a.items.find((s) => s.kind === "hands-on");
  const chips = [{ label: "Demo: plan my Tuesday afternoon", text: DEMO_GOAL }];
  if (hands) chips.push({ label: `Curveball: meeting at ${ampm(hands.start)}`, text: `I just got a customer meeting at ${ampm(hands.start)} for an hour. Keep a hands-on session if you can.` });
  else chips.push({ label: "Curveball: meeting during the hands-on session", text: null });
  $("chips").innerHTML = chips.map((c, i) => `<button class="chip" data-i="${i}" ${!c.text || S.busy ? "disabled" : ""}>${esc(c.label)}</button>`).join("");

function renderLog() {

    svg += `<circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${col[n.kind]}"/>`;
    if (n.kind === "session" || n.kind === "paired") {
      svg += `<text x="${n.x}" y="${n.y + 4}" font-size="${n.kind === "session" ? 11 : 9.5}" font-weight="800" fill="#062421" text-anchor="middle">${esc(n.label)}</text>`;
    } else {
      const lbl = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
      svg += `<text x="${n.x + (n.side === "l" ? -9 : 9)}" y="${n.y + 4}" font-size="11" fill="${n.kind === "repeat" ? "var(--muted)" : "var(--text)"}" text-anchor="${n.side === "l" ? "end" : "start"}">${esc(lbl)}</text>`;
    }
  }
  svg += `<g font-size="10" fill="var(--muted)"><circle cx="8" cy="${H - 8}" r="4" fill="var(--talk)"/><text x="16" y="${H - 4}">topic</text><circle cx="56" cy="${H - 8}" r="4" fill="var(--handson)"/><text x="64" y="${H - 4}">AWS service</text><circle cx="138" cy="${H - 8}" r="4" fill="var(--ok)"/><text x="146" y="${H - 4}">on your agenda</text><circle cx="234" cy="${H - 8}" r="4" fill="var(--muted)"/><text x="242" y="${H - 4}">same session, another time</text></g>`;
  return svg + `</svg>`;
}

poll();
window.addEventListener("resize", () => { renderAgenda(); });
</script>
